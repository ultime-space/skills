name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/codecraft
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test
      - run: npm run eval
      - run: npm run self-check
      - run: npm pack --dry-run

  docscraft:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/docscraft
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test
      - run: npm pack --dry-run
