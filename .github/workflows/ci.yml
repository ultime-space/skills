name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: skills/codecraft
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - run: npm test
      - run: npm run release-check
      - run: npm run eval
      - run: npm run self-check
      - run: npm pack --dry-run

  docscraft:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: skills/docscraft
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - run: npm test
      - run: npm run release-check
      - run: npm pack --dry-run

  designcraft:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: skills/designcraft
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - run: npm test
      - run: npm run release-check
      - run: npm pack --dry-run

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check shared boundary scanners
        run: |
          diff skills/codecraft/scripts/check-package-content.mjs skills/designcraft/scripts/check-package-content.mjs
          diff skills/codecraft/scripts/check-package-content.mjs skills/docscraft/scripts/check-package-content.mjs
          diff skills/codecraft/tests/release-content.test.mjs skills/designcraft/tests/release-content.test.mjs
          diff skills/codecraft/tests/release-content.test.mjs skills/docscraft/tests/release-content.test.mjs
